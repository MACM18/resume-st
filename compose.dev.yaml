services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      S3_ENDPOINT: http://storage:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DEMO_MODE: "true"
    networks: [default, existing-db]
    depends_on:
      storage-init:
        condition: service_completed_successfully
  worker:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    networks: [default, existing-db]
  setup:
    networks: [default, existing-db]
  migrate:
    networks: [default, existing-db]
  seed:
    networks: [default, existing-db]
  storage:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - media-data:/data
  storage-init:
    build:
      context: .
      target: runner
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      - storage
    command: ["npm", "run", "storage:init"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
networks:
  existing-db:
    external: true
    name: ${POSTGRES_NETWORK:-dev-network}
volumes:
  media-data:
